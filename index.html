<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEIYL AUTH // System Login/Register</title>
  <meta name="description" content="Cyberpunk SHUD - Sistem Login/Register dengan PHP Native dan JSON Storage">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SCANLINE OVERLAY -->
  <div class="scanline-overlay" aria-hidden="true"></div>
  <!-- GRID BACKGROUND -->
  <div class="grid-bg" aria-hidden="true"></div>


  <!-- HEADER BAR -->
  <header class="hud-header" id="hudHeader">
    <div class="header-left">
      <div class="system-status" id="systemStatus">
        <span class="status-dot online"></span>
        <span class="status-label">SYSTEM ONLINE</span>
      </div>
      <div class="server-indicator">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
        <span>NODE-07 // ACTIVE</span>
      </div>
    </div>

    <div class="header-center">
      <div class="nexus-brand">
        <svg class="icon icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span class="brand-text">VEIYL<span class="brand-accent">AUTH</span></span>
      </div>
    </div>

    <div class="header-right">
      <div class="digital-clock" id="digitalClock">
        <span class="clock-time">00:00:00</span>
      </div>
      <div class="player-avatar" id="playerAvatar">
        <div class="avatar-frame">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="avatar-label">GUEST</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="hud-main">
    <!-- ── AUTH FORM PANEL ── -->
    <section class="panel auth-panel" id="authPanel">
      <div class="auth-container">
        <!-- Tab Switcher -->
        <div class="auth-tabs" id="authTabs">
          <button class="auth-tab active" data-tab="login" id="tabLogin">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>LOGIN</span>
          </button>
          <button class="auth-tab" data-tab="register" id="tabRegister">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span>REGISTER</span>
          </button>
          <div class="tab-indicator" id="tabIndicator"></div>
        </div>

        <!-- Auth Form Container -->
        <div class="auth-forms-wrapper" id="authFormsWrapper">
          <!-- LOGIN FORM -->
          <form class="auth-form active" id="loginForm" autocomplete="off">
            <div class="form-header">
              <div class="form-icon-wrapper">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
              </div>
              <h1 class="form-title">AGENT LOGIN</h1>
              <p class="form-subtitle">Authenticate to access the system</p>
            </div>

            <!-- Alert Area -->
            <div class="alert-area" id="loginAlert"></div>

            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-bracket left">[</span>
                <div class="input-inner">
                  <svg class="icon icon-input" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                  <input type="email" id="loginEmail" class="hud-input" placeholder="email@nexus.sys" required>
                </div>
                <span class="input-bracket right">]</span>
              </div>
              <label class="input-label" for="loginEmail">EMAIL ADDRESS</label>
            </div>

            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-bracket left">[</span>
                <div class="input-inner">
                  <svg class="icon icon-input" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                  </svg>
                  <input type="password" id="loginPassword" class="hud-input" placeholder="••••••••••" required>
                  <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                    <svg class="icon icon-sm eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="icon icon-sm eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                  </button>
                </div>
                <span class="input-bracket right">]</span>
              </div>
              <label class="input-label" for="loginPassword">PASSWORD</label>
            </div>

            <div class="form-options">
              <label class="hud-checkbox-label">
                <input type="checkbox" id="rememberMe" class="hud-checkbox-input">
                <span class="hud-checkbox-custom"></span>
                <span>Remember Me</span>
              </label>
            </div>

            <button type="submit" class="hud-btn primary" id="loginBtn">
              <span class="btn-content">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                <span>INITIATE LOGIN</span>
              </span>
              <span class="btn-scanline"></span>
            </button>

            <p class="form-switch-text">
              No credentials? 
              <button type="button" class="link-btn" id="switchToRegister">Register new agent</button>
            </p>
          </form>

          <!-- REGISTER FORM -->
          <form class="auth-form" id="registerForm" autocomplete="off">
            <div class="form-header">
              <div class="form-icon-wrapper register-icon">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="8.5" cy="7" r="4"></circle>
                  <line x1="20" y1="8" x2="20" y2="14"></line>
                  <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
              </div>
              <h1 class="form-title">AGENT REGISTRATION</h1>
              <p class="form-subtitle">Create new system credentials</p>
            </div>

            <!-- Alert Area -->
            <div class="alert-area" id="registerAlert"></div>

            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-bracket left">[</span>
                <div class="input-inner">
                  <svg class="icon icon-input" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input type="text" id="regName" class="hud-input" placeholder="Agent Codename" required minlength="3">
                </div>
                <span class="input-bracket right">]</span>
              </div>
              <label class="input-label" for="regName">AGENT NAME</label>
            </div>

            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-bracket left">[</span>
                <div class="input-inner">
                  <svg class="icon icon-input" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                  <input type="email" id="regEmail" class="hud-input" placeholder="email@nexus.sys" required>
                </div>
                <span class="input-bracket right">]</span>
              </div>
              <label class="input-label" for="regEmail">EMAIL ADDRESS</label>
            </div>

            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-bracket left">[</span>
                <div class="input-inner">
                  <svg class="icon icon-input" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                  </svg>
                  <input type="password" id="regPassword" class="hud-input" placeholder="Min 6 characters" required minlength="6">
                  <button type="button" class="toggle-password" data-target="regPassword" aria-label="Toggle password visibility">
                    <svg class="icon icon-sm eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="icon icon-sm eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                  </button>
                </div>
                <span class="input-bracket right">]</span>
              </div>
              <label class="input-label" for="regPassword">PASSWORD</label>
              <!-- Password strength indicator -->
              <div class="password-strength" id="passwordStrength">
                <div class="strength-bars">
                  <span class="strength-bar"></span>
                  <span class="strength-bar"></span>
                  <span class="strength-bar"></span>
                  <span class="strength-bar"></span>
                </div>
                <span class="strength-text" id="strengthText">—</span>
              </div>
            </div>

            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-bracket left">[</span>
                <div class="input-inner">
                  <svg class="icon icon-input" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  </svg>
                  <input type="password" id="regConfirmPassword" class="hud-input" placeholder="Confirm password" required minlength="6">
                </div>
                <span class="input-bracket right">]</span>
              </div>
              <label class="input-label" for="regConfirmPassword">CONFIRM PASSWORD</label>
            </div>

            <button type="submit" class="hud-btn primary register-btn" id="registerBtn">
              <span class="btn-content">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="8.5" cy="7" r="4"></circle>
                  <line x1="20" y1="8" x2="20" y2="14"></line>
                  <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
                <span>CREATE AGENT</span>
              </span>
              <span class="btn-scanline"></span>
            </button>

            <p class="form-switch-text">
              Already registered? 
              <button type="button" class="link-btn" id="switchToLogin">Access login terminal</button>
            </p>
          </form>
        </div>
      </div>

      <!-- Corner Decorations -->
      <div class="corner-decor top-left" aria-hidden="true"></div>
      <div class="corner-decor top-right" aria-hidden="true"></div>
      <div class="corner-decor bottom-left" aria-hidden="true"></div>
      <div class="corner-decor bottom-right" aria-hidden="true"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="hud-footer">
    <div class="footer-left">
      <span class="footer-tag">v1.0.0 // VEIYL FRAMEWORK</span>
    </div>
    <div class="footer-center">
      <span class="data-stream" id="dataStream" aria-hidden="true"></span>
    </div>
    <div class="footer-right">
      <span class="footer-tag">SESSION: <span class="text-cyan" id="sessionId">—</span></span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
